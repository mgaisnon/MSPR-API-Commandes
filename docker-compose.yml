services:
  commandes-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://user:password@db-commandes:3306/commandes_db
    depends_on:
      - db-commandes
    networks:
      - payetonkawa-network
  db-commandes:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=commandes_db
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    volumes:
      - commandes_data:/var/lib/mysql
    networks:
      - payetonkawa-network
networks:
  payetonkawa-network:
    driver: bridge
volumes:
  commandes_data: